esphome:
  name: headphonesrest

esp8266:
  board: esp01_1m # ESP-01S = 1 MB flash
  restore_from_flash: true

logger:
api: # native Home Assistant integration
ota:
  - platform: esphome # enables wireless updates after first flash

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {} # fallback hotspot if Wi-Fi fails

light:
  - platform: neopixelbus
    pin: GPIO3
    method: ESP8266_DMA # GPIO3-only method on ESP8266, hardware-driven
    type: GRB
    variant: WS2812
    num_leds: 21
    name: "LEDs"
    effects:
      - addressable_rainbow:
          name: "Rainbow"
      - addressable_color_wipe:
          name: "Color Wipe"
      - addressable_scan:
          name: "Scan"
      - addressable_twinkle:
          name: "Twinkle"
      - addressable_random_twinkle:
          name: "Random Twinkle"
      - addressable_fireworks:
          name: "Fireworks"
      - addressable_flicker:
          name: "Addressable Flicker"
      - pulse:
          name: "Pulse"
      - random:
          name: "Random"
      - strobe:
          name: "Strobe"
      - flicker:
          name: "Flicker"
      - addressable_lambda:
          name: "Larson Scanner"
          update_interval: 40ms
          lambda: |-
            static int pos = 0;
            static int dir = 1;
            if (initial_run) {
              pos = 0; dir = 1;
              it.all() = Color::BLACK;
              return;
            }
            it.all() = Color::BLACK;
            it[pos] = current_color;
            pos += dir;
            if (pos <= 0 || pos >= it.size() - 1) dir = -dir;

preferences:
  flash_write_interval: 24h
